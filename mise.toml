[tools]
node = "latest"

[tasks.install]
description = "Install npm dependencies"
run = "npm install"

[tasks.dev]
description = "Start Vite dev server with PTT WebSocket proxy"
run = "npm run dev"

[tasks.typecheck]
description = "Run TypeScript type checking"
run = "npm run typecheck"

[tasks.build]
description = "Typecheck and build production bundle"
run = "npm run build"

[tasks.preview]
description = "Preview production build"
run = "npm run preview"
