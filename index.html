<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0c0c0f">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>GhosPTT — libghostty-vt WASM PTT Client</title>
  <style>
    :root {
      --bg: #0c0c0f;
      --panel: #16161d;
      --border: #2a2a37;
      --text: #e0e0e8;
      --muted: #8a8a9e;
      --accent: #4ea8de;
      --success: #52b788;
      --danger: #e63946;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      min-width: 0;
      padding: 16px;
      gap: 12px;
    }

    header {
      width: 100%;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 16px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .badge {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #232330;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }

    .dot.connected {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .dot.error {
      background: var(--danger);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      background: #232332;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    button:hover:not(:disabled) {
      background: #2e2e42;
      border-color: #3e3e58;
    }

    button.primary {
      background: #1d4e89;
      border-color: #2b6cb0;
    }

    button.primary:hover:not(:disabled) {
      background: #2660a4;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    header, .metrics-panel, .footer { flex-shrink: 0; }
    .brand, .badge, .controls { min-width: 0; }
    .brand { flex-wrap: wrap; }
    .badge, .footer { overflow-wrap: anywhere; }
    .terminal-stage {
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .terminal-wrapper {
      position: relative;
      background: #000000;
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 6px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      outline: none;
    }

    .terminal-wrapper:focus-within,
    .terminal-wrapper.focused {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(78, 168, 222, 0.25), 0 12px 36px rgba(0, 0, 0, 0.6);
    }

    canvas {
      display: block;
      background: #000000;
      cursor: text;
    }

    @media (max-width: 600px) {
      body { padding: 8px; gap: 8px; }
      header { padding: 8px; gap: 8px; }
      .controls { gap: 4px; }
      button { padding: 6px 8px; }
      .terminal-wrapper { padding: 2px; border-radius: 4px; }
      .metrics-panel, .footer { display: none; }
    }
    @media (max-height: 650px) {
      .metrics-panel, .footer { display: none; }
      body { padding: 4px; gap: 4px; }
      header { max-height: 35dvh; overflow-y: auto; }
    }

    /* Hidden textarea to support IME composition (Chinese input) & clipboard paste */
    #imeInput {
      position: absolute;
      left: 0;
      top: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      border: none;
      outline: none;
      background: transparent;
      color: transparent;
    }

    .footer {
      width: 100%;
      min-width: 0;
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
      padding: 0 4px;
      flex-wrap: wrap;
      gap: 8px;
    }

    kbd {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      font-family: monospace;
      font-size: 11px;
      color: var(--text);
    }

    .metrics-panel {
      width: 100%;
      min-width: 0;
      display: flex;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 14px;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    .metric-badge {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .metric-key {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .metric-val {
      color: var(--text);
      font-weight: 600;
    }

    /* Image Preview Popover */
    .image-hover-popover {
      position: absolute;
      z-index: 50;
      display: none;
      flex-direction: column;
      background: #181824;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.85);
      overflow: hidden;
      pointer-events: auto;
      width: 260px;
      cursor: pointer;
      animation: popoverFadeIn 0.15s ease-out;
    }

    @keyframes popoverFadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .popover-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: #12121c;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
    }

    .popover-badge {
      background: #252538;
      color: var(--accent);
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-family: monospace;
      font-size: 11px;
    }

    .popover-hint {
      color: var(--muted);
      font-size: 11px;
    }

    .popover-body {
      width: 260px;
      min-height: 48px;
      max-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      overflow: hidden;
    }

    .popover-url {
      width: 100%;
      padding: 10px 12px;
      font-size: 11px;
      color: var(--text);
      font-family: ui-monospace, monospace;
      word-break: break-all;
      background: #0b0b12;
      line-height: 1.4;
      display: none;
    }

    .popover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Image Lightbox Modal */
    .image-lightbox-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      animation: modalFadeIn 0.2s ease-out;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .lightbox-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
    }

    .lightbox-dialog {
      position: relative;
      z-index: 10;
      width: 90vw;
      max-width: 1000px;
      height: 85vh;
      max-height: 85vh;
      background: #16161f;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .lightbox-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: #12121a;
      border-bottom: 1px solid var(--border);
      gap: 16px;
      flex-shrink: 0;
      height: 48px;
    }

    .lightbox-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      max-width: 60vw;
    }

    .lightbox-counter {
      background: #252538;
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-family: ui-monospace, monospace;
      font-size: 11px;
      flex-shrink: 0;
    }

    .lightbox-title {
      font-size: 13px;
      color: var(--text);
      font-family: ui-monospace, monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lightbox-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
      background: rgba(22, 22, 31, 0.75);
      backdrop-filter: blur(4px);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
      user-select: none;
    }

    .lightbox-nav-btn:hover {
      background: rgba(38, 96, 164, 0.9);
      border-color: var(--accent);
      color: #ffffff;
      transform: translateY(-50%) scale(1.08);
    }

    .lightbox-nav-btn.prev {
      left: 16px;
    }

    .lightbox-nav-btn.next {
      right: 16px;
    }

    .lightbox-content {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .lightbox-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .lightbox-btn {
      background: #232332;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: background 0.15s;
    }

    .lightbox-btn:hover {
      background: #2e2e42;
    }

    .lightbox-btn.primary {
      background: #1d4e89;
      border-color: #2b6cb0;
    }

    .lightbox-btn.primary:hover {
      background: #2660a4;
    }

    .lightbox-close {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 20px;
      cursor: pointer;
      padding: 0 6px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }

    .lightbox-close:hover {
      color: #ffffff;
    }

    .lightbox-body {
      position: relative;
      flex: 1;
      width: 100%;
      height: calc(100% - 48px);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #08080c;
      overflow: hidden;
      padding: 16px;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 4px;
      transition: opacity 0.15s ease;
      opacity: 1;
      display: block;
    }

    .lightbox-spinner {
      position: absolute;
      display: none;
      color: var(--muted);
      font-size: 13px;
      padding: 10px 18px;
      background: rgba(22, 22, 31, 0.85);
      border: 1px solid var(--border);
      border-radius: 6px;
      backdrop-filter: blur(4px);
      pointer-events: none;
      font-family: system-ui, sans-serif;
      z-index: 15;
    }
      font-family: system-ui, sans-serif;
    }
  </style>
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <header>
    <div class="brand">
      <img src="/favicon.svg" alt="GhosPTT icon" width="24" height="24" style="border-radius: 6px; display: block;">
      <h1>GhosPTT</h1>
      <span class="badge">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Initializing WASM...</span>
      </span>
    </div>
    <div class="controls">
      <button id="connectBtn" class="primary" disabled>Connect</button>
      <button id="disconnectBtn" disabled>Disconnect</button>
      <button id="rendererBtn" title="Switch between WebGPU and Canvas 2D renderer">Renderer: ...</button>
      <button id="crtBtn" title="Toggle WebGPU CRT scanline & curvature shader" disabled>CRT: Off</button>
      <button id="copyBtn" title="Copy selected text (or Ctrl+Shift+C / Ctrl+C)" disabled>Copy</button>
      <button id="pasteBtn" title="Paste clipboard (or Ctrl+Shift+V / Ctrl+V)" disabled>Paste</button>
      <button data-send="guest\r" class="quick-btn" title="Send 'guest' + Enter" disabled>Login Guest</button>
      <button data-send="\r" class="quick-btn" title="Send Enter" disabled>Enter</button>
      <button data-send="\x1b[D" class="quick-btn" title="Left Arrow (Back)" disabled>←</button>
      <button data-send="\x1b[A" class="quick-btn" title="Up Arrow" disabled>↑</button>
      <button data-send="\x1b[B" class="quick-btn" title="Down Arrow" disabled>↓</button>
      <button data-send="\x1b[C" class="quick-btn" title="Right Arrow" disabled>→</button>
    </div>
  </header>

  <main class="terminal-stage" id="terminalStage">
  <div class="terminal-wrapper" id="termWrapper" tabindex="0">
    <canvas id="termCanvas" width="960" height="576"></canvas>
    <canvas id="gpuCanvas" width="960" height="576" style="display: none;"></canvas>
    <textarea id="imeInput" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
  </div>

  </main>

  <div class="metrics-panel" id="metricsPanel">
    <div class="metric-badge">
      <span class="metric-key">Backend</span>
      <span class="metric-val" id="metricBackend">--</span>
    </div>
    <div class="metric-badge">
      <span class="metric-key">Frame Time</span>
      <span class="metric-val" id="metricFrameTime">--</span>
    </div>
    <div class="metric-badge">
      <span class="metric-key">FPS</span>
      <span class="metric-val" id="metricFps">--</span>
    </div>
    <div class="metric-badge">
      <span class="metric-key">Draw / Quads</span>
      <span class="metric-val" id="metricDrawCount">--</span>
    </div>
    <div class="metric-badge">
      <span class="metric-key">Glyph Cache</span>
      <span class="metric-val" id="metricGlyphCache">--</span>
    </div>
    <div class="metric-badge">
      <span class="metric-key">Texture Atlas</span>
      <span class="metric-val" id="metricAtlas">--</span>
    </div>
    <div class="metric-badge">
      <span class="metric-key">GPU Mem</span>
      <span class="metric-val" id="metricGpuMem">--</span>
    </div>
  </div>

  <div class="footer">
    <div>
      Drag to select · <kbd>Ctrl+C</kbd> / <kbd>Ctrl+Shift+C</kbd> Copy · <kbd>Ctrl+V</kbd> / <kbd>Ctrl+Shift+V</kbd> Paste · Keys: <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> <kbd>Enter</kbd> <kbd>PgUp</kbd>/<kbd>PgDn</kbd>
    </div>
    <div id="statsText">80×24 · Big5 / Telnet · libghostty-vt.wasm</div>
  </div>
</body>
</html>
